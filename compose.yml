name: nvidia-build-lb

services:
  db:
    image: ${NBLB_POSTGRES_IMAGE:?immutable PostgreSQL image digest required}
    environment:
      POSTGRES_DB: nvidia_build_lb
      POSTGRES_USER: nvidia_build_lb
      PGDATA: /var/lib/postgresql/data/pgdata
    labels:
      nvidia-build-lb.component: database
      nvidia-build-lb.backup-source: ${NBLB_BACKUP_SOURCE:-true}
      nvidia-build-lb.restore-isolated: ${NBLB_RESTORE_ISOLATED:-false}
      com.centurylinklabs.watchtower.enable: "false"
    secrets:
      - source: db_password
        target: /run/canonical-secrets/db_password
        mode: 0400
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs:
      - /run/nvidia-build-lb/secrets:rw,noexec,nosuid,nodev,size=64k,mode=0700,uid=0,gid=0
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=0775,uid=70,gid=70
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/setpriv", "--reuid=70", "--regid=70", "--clear-groups", "--inh-caps=-all", "--ambient-caps=-all", "--bounding-set=-all", "--no-new-privs", "/usr/local/bin/nblb-healthcheck", "70", "70", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - data
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    image: ${NBLB_APP_IMAGE:?immutable application image digest required}
    environment:
      NVIDIA_BUILD_LB_MODE: migrate
      NVIDIA_BUILD_LB_DATABASE_URL: postgresql+asyncpg://nvidia_build_lb@db/nvidia_build_lb
      NVIDIA_BUILD_LB_DATABASE_PASSWORD_FILE: /run/nvidia-build-lb/secrets/db_password
    labels:
      nvidia-build-lb.component: migration
      com.centurylinklabs.watchtower.enable: "false"
    secrets:
      - source: db_password
        target: /run/canonical-secrets/db_password
        mode: 0400
    tmpfs:
      - /run/nvidia-build-lb/secrets:rw,noexec,nosuid,nodev,size=64k,mode=0700,uid=0,gid=0
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    restart: "no"
    stop_grace_period: 30s

  app:
    image: ${NBLB_APP_IMAGE:?immutable application image digest required}
    environment:
      NVIDIA_BUILD_LB_MODE: app
      NVIDIA_BUILD_LB_DATABASE_URL: postgresql+asyncpg://nvidia_build_lb@db/nvidia_build_lb
      NVIDIA_BUILD_LB_DATABASE_PASSWORD_FILE: /run/nvidia-build-lb/secrets/db_password
      NVIDIA_BUILD_LB_ADMIN_TOKEN_FILE: /run/nvidia-build-lb/secrets/admin_token
      NVIDIA_BUILD_LB_VAULT_KEY_FILE: /run/nvidia-build-lb/secrets/vault_master_key
    labels:
      nvidia-build-lb.component: gateway
      com.centurylinklabs.watchtower.enable: "false"
    secrets:
      - source: admin_token
        target: /run/canonical-secrets/admin_token
        mode: 0400
      - source: vault_master_key
        target: /run/canonical-secrets/vault_master_key
        mode: 0400
      - source: db_password
        target: /run/canonical-secrets/db_password
        mode: 0400
    tmpfs:
      - /run/nvidia-build-lb/secrets:rw,noexec,nosuid,nodev,size=64k,mode=0700,uid=0,gid=0
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - ${NBLB_BIND_ADDRESS:-127.0.0.1}:${NBLB_PORT:-2456}:2456
    networks:
      - data
      - egress
    restart: unless-stopped
    stop_grace_period: 30s

secrets:
  admin_token:
    file: ${NBLB_SECRET_DIR:?root-only secret directory required}/admin_token
  vault_master_key:
    file: ${NBLB_SECRET_DIR:?root-only secret directory required}/vault_master_key
  db_password:
    file: ${NBLB_SECRET_DIR:?root-only secret directory required}/db_password

networks:
  data:
    internal: true
  egress: {}

volumes:
  db-data:
