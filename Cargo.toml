[workspace]
members = ["crates/core", "crates/gateway"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["DongwonTTuna-Labs"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.dependencies]
actix-web = "4.11"
actix-files = "0.6"
aes-gcm = "0.10"
anyhow = "1.0"
base64 = "0.22"
bytes = "1.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
httpdate = "1.0"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
