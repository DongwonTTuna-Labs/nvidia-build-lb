name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rust
          push: true
          tags: ghcr.io/dongwonttuna-labs/nvidia-build-lb:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DongwonTTuna-Labs/nvidia-build-lb
            org.opencontainers.image.revision=${{ github.sha }}
