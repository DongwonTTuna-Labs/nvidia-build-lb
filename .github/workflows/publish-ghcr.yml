name: Publish GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: nblb-publish-ci-only
          POSTGRES_DB: nblb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nblb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:nblb-publish-ci-only@127.0.0.1:5432/nblb
    outputs:
      app_registry_digest: ${{ steps.publish.outputs.app_registry_digest }}
      postgres_registry_digest: ${{ steps.publish.outputs.postgres_registry_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Rust and Svelte source
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          bun install --cwd apps/admin --frozen-lockfile --ignore-scripts --no-progress
          bun run --cwd apps/admin test
          bun run --cwd apps/admin check
          bun run --cwd apps/admin format
          bun run --cwd apps/admin knip
          bun run --cwd apps/admin build
          bun install --cwd apps/public --frozen-lockfile --ignore-scripts --no-progress
          bun run --cwd apps/public check
          bun run --cwd apps/public format
          bun run --cwd apps/public knip
          bun run --cwd apps/public build
      - name: Build immutable images
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          image_repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="$image_repository:sha-$IMAGE_SHA"
          POSTGRES_TAG="$image_repository:postgres-sha-$IMAGE_SHA"
          docker buildx build --pull --build-arg NBLB_GIT_COMMIT="$IMAGE_SHA" --file Dockerfile.rust --tag "$IMAGE_TAG" --push .
          docker buildx build --pull --file docker/postgres.Dockerfile --tag "$POSTGRES_TAG" --push .
      - name: Resolve and publish immutable digests
        id: publish
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          image_repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="$image_repository:sha-$IMAGE_SHA"
          POSTGRES_TAG="$image_repository:postgres-sha-$IMAGE_SHA"
          # Compose owns the `sha256:` reference prefix.  Keep workflow
          # outputs as the raw hexadecimal digest so operators cannot produce
          # an invalid `sha256:sha256:...` image reference when copying the
          # values into runtime.env.
          app_digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --raw | sha256sum | cut -d' ' -f1)"
          postgres_digest="$(docker buildx imagetools inspect "$POSTGRES_TAG" --raw | sha256sum | cut -d' ' -f1)"
          printf 'app_registry_digest=%s\n' "$app_digest" >> "$GITHUB_OUTPUT"
          printf 'postgres_registry_digest=%s\n' "$postgres_digest" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' '### Immutable deployment digests' '```text'
            printf '%s\n' "NBLB_APP_REGISTRY_DIGEST=$app_digest" "NBLB_POSTGRES_REGISTRY_DIGEST=$postgres_digest"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
