name: Publish GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      app_registry_digest: ${{ steps.publish.outputs.app_registry_digest }}
      postgres_registry_digest: ${{ steps.publish.outputs.postgres_registry_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.11.24"
          enable-cache: true
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Install locked Python and browser dependencies
        run: |
          uv sync --frozen --all-groups
          npm ci --ignore-scripts --no-audit --no-fund
          uv run playwright install --with-deps chromium
      - name: Verify source and tests
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run basedpyright
          uv run pytest -q
      - name: Build and exercise the manifest-bound image pair
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/candidate
        run: scripts/qa/build-candidate.sh
      - name: Resolve immutable candidate pair
        id: candidate
        shell: bash
        run: |
          app=$(jq -er '.image_digest' "${RUNNER_TEMP}/candidate/candidate.json")
          postgres=$(jq -er '.postgres_image_digest' "${RUNNER_TEMP}/candidate/candidate.json")
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          echo "postgres=${postgres}" >> "$GITHUB_OUTPUT"
      - name: Scan the exact candidate pair
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/scan
          IMAGE_DIGEST: ${{ steps.candidate.outputs.app }}
          POSTGRES_IMAGE_DIGEST: ${{ steps.candidate.outputs.postgres }}
          SOURCE_MANIFEST: ${{ runner.temp }}/candidate/source-manifest.json
        run: scripts/qa/scan-release.sh
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag, publish, and bind deployable registry digests
        id: publish
        shell: bash
        env:
          APP_DIGEST: ${{ steps.candidate.outputs.app }}
          POSTGRES_DIGEST: ${{ steps.candidate.outputs.postgres }}
        run: |
          package="ghcr.io/${GITHUB_REPOSITORY,,}"
          app_ref="${package}:sha-${GITHUB_SHA}"
          postgres_ref="${package}:postgres-sha-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Id}}' "$APP_DIGEST")" = "$APP_DIGEST"
          test "$(docker image inspect --format '{{.Id}}' "$POSTGRES_DIGEST")" = "$POSTGRES_DIGEST"
          docker tag "$APP_DIGEST" "$app_ref"
          docker tag "$POSTGRES_DIGEST" "$postgres_ref"
          docker push "$app_ref"
          docker push "$postgres_ref"
          receipt_dir=$(mktemp -d "${RUNNER_TEMP}/registry-receipts.XXXXXX")
          cleanup_receipts() {
            rm -f -- "$receipt_dir/app.json" "$receipt_dir/postgres.json"
            rmdir -- "$receipt_dir"
          }
          trap cleanup_receipts EXIT
          docker buildx imagetools inspect "$app_ref" --raw > "$receipt_dir/app.json"
          docker buildx imagetools inspect "$postgres_ref" --raw \
            > "$receipt_dir/postgres.json"
          app_registry_digest=$(uv run python -m scripts.qa.registry_manifest_digest \
            --manifest "$receipt_dir/app.json" --expected-image-id "$APP_DIGEST")
          postgres_registry_digest=$(uv run python -m scripts.qa.registry_manifest_digest \
            --manifest "$receipt_dir/postgres.json" --expected-image-id "$POSTGRES_DIGEST")
          printf '%s\n' \
            "app_registry_digest=$app_registry_digest" \
            "postgres_registry_digest=$postgres_registry_digest" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' '### Immutable deployment digests' '```text'
            printf '%s\n' \
              "NBLB_APP_REGISTRY_DIGEST=$app_registry_digest" \
              "NBLB_POSTGRES_REGISTRY_DIGEST=$postgres_registry_digest"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
