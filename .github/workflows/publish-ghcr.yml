name: Publish GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      app_registry_digest: ${{ steps.publish.outputs.app_registry_digest }}
      postgres_registry_digest: ${{ steps.publish.outputs.postgres_registry_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Rust and Svelte source
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          npm --prefix apps/admin ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/admin run check
          npm --prefix apps/admin run format
          npm --prefix apps/admin run knip
          npm --prefix apps/admin run build
      - name: Build immutable images
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          image_repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="$image_repository:sha-$IMAGE_SHA"
          POSTGRES_TAG="$image_repository:postgres-sha-$IMAGE_SHA"
          docker buildx build --pull --file Dockerfile.rust --tag "$IMAGE_TAG" --push .
          docker buildx build --pull --file docker/postgres.Dockerfile --tag "$POSTGRES_TAG" --push .
      - name: Resolve and publish immutable digests
        id: publish
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          image_repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="$image_repository:sha-$IMAGE_SHA"
          POSTGRES_TAG="$image_repository:postgres-sha-$IMAGE_SHA"
          app_digest="sha256:$(docker buildx imagetools inspect "$IMAGE_TAG" --raw | sha256sum | cut -d' ' -f1)"
          postgres_digest="sha256:$(docker buildx imagetools inspect "$POSTGRES_TAG" --raw | sha256sum | cut -d' ' -f1)"
          printf 'app_registry_digest=%s\n' "$app_digest" >> "$GITHUB_OUTPUT"
          printf 'postgres_registry_digest=%s\n' "$postgres_digest" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' '### Immutable deployment digests' '```text'
            printf '%s\n' "NBLB_APP_REGISTRY_DIGEST=$app_digest" "NBLB_POSTGRES_REGISTRY_DIGEST=$postgres_digest"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
