name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.11.24"
          enable-cache: true
      - name: Install locked Python and browser dependencies
        run: |
          uv sync --frozen --all-groups
          npm ci --ignore-scripts
          uv run playwright install --with-deps chromium
      - name: Static analysis
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run basedpyright
      - name: Test
        run: uv run pytest -q
      - name: Audit Python dependencies
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --progress-spinner off --requirement "$RUNNER_TEMP/requirements.txt"
      - name: Build immutable application surface
        run: |
          docker build --pull --build-arg SOURCE_DATE_EPOCH=0 --tag nvidia-build-lb:ci .
          docker build --pull --file docker/postgres.Dockerfile --tag nvidia-build-lb-postgres:ci .
