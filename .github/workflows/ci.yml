name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Rust format
        run: |
          cargo fmt --all -- --check
      - name: Rust tests and lint
        run: |
          cargo test -p nvidia-build-lb-core -p nvidia-build-lb-gateway
          cargo clippy -p nvidia-build-lb-core -p nvidia-build-lb-gateway --all-targets -- -D warnings
      - name: Legacy source contract
        run: |
          legacy_files="$(git ls-files | grep -Ei '\.(py|pyw|sh|bash|zsh|js|jsx|mjs|cjs)$' || true)"
          test -z "$legacy_files"
      - name: Svelte checks
        run: |
          bun install --cwd apps/admin --frozen-lockfile --ignore-scripts --no-progress
          bun run --cwd apps/admin check
          bun run --cwd apps/admin format
          bun run --cwd apps/admin knip
          bun run --cwd apps/admin build
      - name: Build runtime images
        run: |
          docker build --pull --file Dockerfile.rust --tag nvidia-build-lb:ci .
          docker build --pull --file docker/postgres.Dockerfile --tag nvidia-build-lb-postgres:ci .
